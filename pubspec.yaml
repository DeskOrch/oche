name: oche_workspace
description: Repository tooling and tests for the Oche monorepo.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/oche
  - packages/oche_core
  - packages/oche_codegen
  - packages/oche_cli
  - packages/oche_test
  - examples/hello_oche
  - benchmarks/raw_dart_io
  - benchmarks/relic
  - benchmarks/oche_static
  - benchmarks/routing_kernel
  - benchmarks/handler_execution
  - benchmarks/harness

dependencies:
  handler_execution_benchmark: ^0.0.1
  oche_benchmark_harness: ^0.0.1
  oche_static_benchmark: ^0.0.1
  raw_dart_io_benchmark: ^0.0.1
  relic_benchmark: ^0.0.1
  routing_kernel_benchmark: ^0.0.1

dev_dependencies:
  build: ^4.0.10
  build_test: ^3.5.16
  lints: ^6.0.0
  oche: ^0.0.1
  oche_codegen: ^0.0.1
  oche_core: ^0.0.1
  test: ^1.26.0
